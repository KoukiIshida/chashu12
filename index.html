<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>チャーシュー12倍クイズ</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#1c1410; --panel:#2b201a; --panel2:#3b2c23; --text:#fff6ec; --muted:#c3ab98;
  --accent:#ffb02e; --danger:#e5484d; --ok:#3ccf7a; --blue:#2f7de1;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;
  -webkit-tap-highlight-color:transparent}
img{max-width:100%}
button{font:inherit;cursor:pointer;border:none;border-radius:10px;padding:10px 18px;background:#5a4436;color:#fff;font-weight:700}
button:hover{filter:brightness(1.1)}
button.primary{background:var(--accent);color:#1a1a1a}
button.blue{background:var(--blue)}
button.danger{background:var(--danger)}
button.ghost{background:transparent;border:1px solid #6b5444;color:var(--text)}
button.small{padding:6px 12px;font-size:13px;border-radius:8px}
button.big{font-size:22px;padding:16px 36px}
button.sel{background:var(--accent);color:#1a1a1a}
button:disabled,button.done{background:#4a4542 !important;color:#9a9390 !important;cursor:not-allowed;filter:none}
input[type=text],input[type=number],textarea,select{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid #6b5444;background:#140e0b;color:var(--text)}
input[type=text],textarea{width:100%}
input[type=number]{width:90px;text-align:right}
h1,h2,h3{margin:0 0 12px}
.muted{color:var(--muted)}
.page{max-width:1100px;margin:0 auto;padding:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.card{background:var(--panel);border-radius:14px;padding:16px;margin-bottom:14px}
.note{background:#3a2a0e;border:1px solid #7a5a20;color:#ffe9a8;border-radius:10px;padding:10px 14px;margin-bottom:12px}

.topbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.topbar .title{font-size:22px;font-weight:900;letter-spacing:.05em;margin-right:6px}
.round-label{background:var(--accent);color:#1a1a1a;border-radius:8px;padding:3px 12px;font-weight:900}
.round-label.practice{background:#7a4dd8;color:#fff}

.lobby{display:flex;gap:28px;align-items:center;justify-content:center;flex-wrap:wrap;padding:10px 0}
.qrbox{display:inline-block;background:#fff;padding:14px;border-radius:12px;line-height:0}
.url{word-break:break-all;font-size:14px;color:var(--muted);margin-top:8px}
.plist{display:flex;flex-direction:column;gap:8px;min-width:280px;max-height:420px;overflow:auto}
.pitem{background:var(--panel2);border-radius:10px;padding:10px 14px;font-size:20px;font-weight:800;display:flex;align-items:center;gap:10px}
.dot{width:10px;height:10px;border-radius:50%;background:#666;display:inline-block}
.dot.on{background:var(--ok)}
.stage{text-align:center;padding:10px 0}
.stage h2{font-size:30px}
.timer{font-size:100px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1;margin:10px 0}
.timer .unit{font-size:34px;margin-left:6px}
.timer.zero{color:var(--danger)}
.timer-label{font-size:22px;font-weight:800;color:var(--muted)}
.btnbar{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:18px 0}
.qtext{font-size:30px;font-weight:900;margin:6px 0 10px}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin:14px 0;text-align:left}
.tile{background:var(--panel2);border-radius:12px;padding:10px 12px;border:2px solid transparent}
.tile .nm{font-weight:900;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .st{font-size:15px;color:var(--muted);margin-top:4px}
.tile .mul{font-size:30px;font-weight:900;color:var(--accent)}
.tile.ok{border-color:var(--ok);background:#173a26}
.tile.ok .st{color:#b8f5cf}
.tile.off{opacity:.5}

.reveal-wrap{display:flex;gap:24px;justify-content:center;align-items:flex-start;flex-wrap:wrap;text-align:left}
.qimg-box{max-width:min(620px,100%);text-align:center}
.qimg-box img{max-width:100%;max-height:52vh;display:block;margin:0 auto;border-radius:10px;cursor:zoom-in}
.ov-btns{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.ov-btns button{padding:4px 9px;font-size:13px}
.demo-cap{display:inline-block;background:var(--accent);color:#1a1a1a;border-radius:10px;padding:4px 18px;font-size:26px;font-weight:900;margin-bottom:10px}
.demo-one img{max-width:100%;max-height:62vh;border-radius:10px;cursor:zoom-in;min-width:200px;min-height:120px;background:#2b201a}
.demo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;text-align:center}
.demo-grid figure{margin:0;font-weight:900;font-size:16px}
.demo-grid img{width:100%;border-radius:8px;cursor:zoom-in;display:block;margin-bottom:3px;min-height:80px;background:#2b201a}
.top-img{max-width:100%;max-height:46vh;border-radius:10px;margin-top:10px;cursor:zoom-in;min-height:80px;background:#2b201a}
.reveal-col{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;max-width:820px;margin:0 auto}
.reveal-col .table-wrap,.reveal-col .top-box{width:100%}
.ans-label{font-weight:900;font-size:18px;color:var(--muted);margin-top:6px}
.ans-box{background:#fff;color:#c92a2a;border-radius:12px;padding:10px 26px;font-size:44px;font-weight:900;display:inline-block;margin:0 0 6px}
.supp{font-size:18px;white-space:pre-wrap;margin-bottom:10px}
.top-box{background:linear-gradient(135deg,#7a4a10,#c88a1c);border-radius:14px;padding:14px 18px;text-align:center;margin-bottom:12px}
.top-box .lbl{font-size:18px;font-weight:800}
.top-box .names{font-size:38px;font-weight:900}
.top-box .pts{font-size:22px;font-weight:800}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:7px 10px;border-bottom:1px solid #4a3a2f;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:700;white-space:nowrap}
.table-wrap{overflow-x:auto}
.tag{display:inline-block;border-radius:6px;padding:2px 8px;font-weight:800;font-size:13px;white-space:nowrap}
.tag.ok{background:var(--ok);color:#10301c}
.tag.ng{background:#5a4436;color:#ddd}
.tag.practice{background:#7a4dd8;color:#fff}

.podium{display:flex;gap:14px;justify-content:center;align-items:flex-end;flex-wrap:wrap;margin:10px 0 18px}
.pod{background:var(--panel2);border-radius:14px;padding:14px 20px;min-width:200px;text-align:center}
.pod .rk{font-size:26px;font-weight:900}
.pod .nm{font-size:30px;font-weight:900}
.pod .sc{font-size:24px;font-weight:900;color:var(--accent)}
.pod.r1{background:linear-gradient(135deg,#8a6a10,#e8c040);color:#1a1a1a;padding:24px 30px}
.pod.r1 .sc{color:#5a1a00}
.pod.r1 .nm{font-size:40px}
.pod.r2{background:linear-gradient(135deg,#6a7078,#c8d0d8);color:#1a1a1a}
.pod.r3{background:linear-gradient(135deg,#6a3a1a,#c8803a);color:#1a1a1a}
.pod.r2 .sc,.pod.r3 .sc{color:#3a1a00}

.rule-display{text-align:left;max-width:1100px;margin:20px auto 28px;line-height:1.7;font-size:22px}
.rule-red{color:#c0392b;background:#f0f0f0;border:1px solid #ddd;padding:1px 7px;border-radius:6px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.rule-normal{color:#222}
.rule-display, .rule-display *{color:#fff !important}
.rule-display *:not(.rule-red){background-color:transparent !important}
.rule-display .rule-red, .rule-display .rule-red *{color:#e5342b !important}
.rule-display .rule-red{background:#fff !important;border:none}
.rule-display [style*="font-size"]:not([style*="1.5em"]), .rule-display font[size]{font-size:inherit !important}
.rule-display h1, .rule-display h2, .rule-display h3, .rule-display h4, .rule-display p{font-size:inherit !important;margin:0;font-weight:inherit}
.rule-img{border-radius:8px;margin-bottom:10px;cursor:zoom-in;max-height:50vh}

/* 参加者（スマホ） */
body.sub .page{max-width:520px;padding:10px}
.sub-head{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;font-weight:700;margin-bottom:8px}
.p-center{text-align:center;padding:30px 12px}
.p-item{background:var(--panel);border-radius:12px;padding:12px;text-align:center;margin-bottom:10px}
.p-item .lbl{font-size:13px;color:var(--muted);font-weight:700}
.p-big{font-size:64px;font-weight:900;color:var(--accent);line-height:1.1}
.p-timer{font-size:28px;font-weight:900;font-variant-numeric:tabular-nums;text-align:center;margin:4px 0 8px}
.p-timer.zero{color:var(--danger)}
.sub-img{width:100%;display:block;border-radius:10px;margin-bottom:10px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.sub-sel{width:100%;font-size:22px;padding:12px;font-weight:800}
.sub-btn{width:100%;padding:14px;font-size:18px;margin-top:10px}
.judge{min-height:28px;text-align:center;font-weight:900;font-size:18px;margin-top:8px}
.judge.ng{color:#ff8a8e}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.ok-banner{background:linear-gradient(135deg,#1e9b53,#3ccf7a);border-radius:12px;padding:14px;text-align:center;font-size:26px;font-weight:900;margin-bottom:10px}
.spinner{width:40px;height:40px;border:4px solid #5a4436;border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}

/* モーダル・トースト */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal{background:#fff;color:#1d1d1f;border-radius:14px;padding:20px;max-width:460px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.modal-btns{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.modal button{background:#e3e6ec;color:#1d1d1f}
.img-modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:150}
.img-modal img{max-width:92vw;max-height:92vh}
#toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:200;pointer-events:none;display:flex;flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:92vw}
.toast{background:#3b2c23;color:#fff;border-radius:12px;padding:10px 18px;font-weight:800;box-shadow:0 6px 20px rgba(0,0,0,.4);text-align:center}

.save-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:300}
.save-overlay.active{display:flex}
.save-box{background:#fff;color:#222;padding:24px 30px;border-radius:12px;text-align:center;min-width:260px}
.save-box .spinner{border-color:#ddd;border-top-color:#e0a800}
.save-bar-outer{background:#eee;border-radius:6px;height:10px;margin-top:10px;overflow:hidden}
.save-bar-inner{background:#e0a800;height:100%;width:0%;transition:width .2s}

/* 管理 */
.set-grid{display:grid;grid-template-columns:200px 1fr;gap:12px 16px;align-items:center}
.set-grid>.lbl{font-weight:800}
.sticky-actions{position:sticky;bottom:0;background:var(--bg);padding:10px 0;z-index:5;border-top:1px solid #4a3a2f}
.rich-toolbar{display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin-bottom:4px}
.rich-toolbar button{padding:4px 10px;font-size:13px;border-radius:6px}
.rule-edit{border:1px solid #ccc;border-radius:6px;min-height:70px;padding:10px;background:#fff;color:#222;text-align:left;line-height:1.6}
.rule-slide-card{border:1px solid #4a3a2f;border-radius:10px;padding:10px;margin-bottom:10px;background:#231a15}
.rule-group-block{margin-bottom:10px}
.thumb{max-width:160px;max-height:120px;display:block;border-radius:6px;cursor:zoom-in}
.q-block{border:1px solid #4a3a2f;border-radius:10px;margin-bottom:10px;background:#231a15;overflow:hidden}
.q-block.dragging{opacity:.4}
.q-block.drag-over{border:2px dashed var(--accent)}
.q-head{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#33261e;cursor:pointer;flex-wrap:wrap}
.q-head .q-title{flex:1;font-weight:800;min-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.q-head .mini{width:40px;height:40px;object-fit:cover;border-radius:4px}
.q-drag{cursor:grab;font-size:20px;padding:0 4px;user-select:none;color:var(--muted)}
.hchk{display:inline-flex;align-items:center;gap:4px;font-size:14px;white-space:nowrap;cursor:pointer;background:#140e0b;border-radius:6px;padding:3px 8px}
.q-body{display:none;padding:12px 14px}
.q-body.open{display:block}
.fl{font-weight:800;display:block;margin:12px 0 4px}
.prev-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.prev-grid figure{margin:0;text-align:center;font-size:13px;font-weight:800}
.prev-grid img{width:100%;border-radius:6px;cursor:zoom-in;display:block;margin-bottom:3px;background:#000}
.confirm-row{display:flex;gap:10px;align-items:center;padding:6px 10px;border-bottom:1px solid #4a3a2f}
.confirm-row img{width:44px;height:44px;object-fit:cover;border-radius:4px}
.err-text{color:#ff8a8e;font-weight:700;font-size:14px}
@media (max-width:700px){ .set-grid{grid-template-columns:1fr} }
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast"></div>
<div class="save-overlay" id="save-overlay"><div class="save-box"><div class="spinner"></div><div id="save-msg">保存中…</div>
  <div style="font-size:22px;font-weight:900" id="save-pct">0%</div><div class="save-bar-outer"><div class="save-bar-inner" id="save-bar"></div></div></div></div>

/* ---------- 共通ユーティリティ ---------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function lsGet(k, def){ try{ const v=localStorage.getItem(k); return v==null?def:JSON.parse(v); }catch(e){ return def; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){ alert('ブラウザへの保存に失敗しました'); } }
function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36); }
function stripHtml(h){ return String(h||'').replace(/<[^>]*>/g,'').replace(/&nbsp;/g,' ').trim(); }
function toInt(v){ const s=String(v==null?'':v).replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).trim(); return /^-?\d+$/.test(s) ? parseInt(s,10) : NaN; }
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

function openModal(html, buttons){
  const wrap=document.createElement('div');
  wrap.className='modal-bg';
  wrap.innerHTML=`<div class="modal">${html}<div class="modal-btns"></div></div>`;
  const close=()=>wrap.remove();
  (buttons||[{label:'閉じる'}]).forEach(b=>{
    const el=document.createElement('button');
    el.textContent=b.label; if(b.cls) el.className=b.cls;
    el.onclick=()=>{ if(b.onClick && b.onClick()===false) return; close(); };
    wrap.querySelector('.modal-btns').appendChild(el);
  });
  document.getElementById('modal-root').appendChild(wrap);
  return {el:wrap, close};
}
function showToast(text, ms){
  const el=document.createElement('div'); el.className='toast'; el.textContent=text;
  document.getElementById('toast').appendChild(el);
  setTimeout(()=>el.remove(), ms||2400);
}
/* 画像タップで全画面表示（背景クリックで閉じる） */
document.addEventListener('click', e=>{
  if(e.target.tagName==='IMG' && e.target.closest('.rule-img,.thumb,.qimg-box,.prev-grid,.zoomable')){
    const m=document.createElement('div'); m.className='img-modal';
    m.innerHTML=`<img src="${e.target.src}">`; m.onclick=()=>m.remove();
    document.body.appendChild(m);
  }
});

/* スリープ防止 */
let wakeLock=null;
async function requestWakeLock(){ try{ wakeLock=await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release',()=>{wakeLock=null;}); }catch(e){} }
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible' && !wakeLock && MODE!=='admin') requestWakeLock(); });

/* demoAfter：例題の画像紹介を入れる位置（-1＝ルール説明の最後／0＝入れない／n＝ページnの後） */
function defaultSettings(){ return { selectSec:30, answerSec:45, chashuPct:70, demoAfter:-1 }; }
function defaultAppData(){ return { memo:'', ruleSlides:JSON.parse(JSON.stringify(DEFAULT_RULE_SLIDES)), settings:defaultSettings(), chashuImg:null, questions:[] }; }
function newQuestion(){ return { id:uid(), text:'', img:null, answerLabel:'', answers:'', supp:'', include:true, done:false, layouts:null, layoutV:0, layoutHash:0 }; }
function mergeAppData(d){
  const m=Object.assign(defaultAppData(), d||{});
  if(!Array.isArray(m.ruleSlides)||!m.ruleSlides.length) m.ruleSlides=JSON.parse(JSON.stringify(DEFAULT_RULE_SLIDES));
  m.ruleSlides.forEach(s=>{ if(!Array.isArray(s.groups)||!s.groups.length) s.groups=['']; if(s.img===undefined) s.img=null; });
  if(m.ruleSlides.length===1 && !m.ruleSlides[0].img && JSON.stringify(m.ruleSlides[0].groups)===OLD_DEFAULT_RULE_GROUPS) m.ruleSlides=JSON.parse(JSON.stringify(DEFAULT_RULE_SLIDES));
  const ds=defaultSettings(); m.settings=Object.assign({}, ds, m.settings||{});
  ['selectSec','answerSec','chashuPct'].forEach(k=>{ const v=toInt(m.settings[k]); m.settings[k]= isNaN(v)||v<1 ? ds[k] : v; });
  { const v=toInt(m.settings.demoAfter); m.settings.demoAfter= isNaN(v)||v<-1 ? -1 : v; }
  if(!Array.isArray(m.questions)) m.questions=[];
  m.questions=m.questions.map(q=>Object.assign(newQuestion(), q));
  if(typeof m.memo!=='string') m.memo='';
  return m;
}
function openDb(){ return new Promise((res,rej)=>{ const r=indexedDB.open(DB_NAME,1); r.onupgradeneeded=()=>r.result.createObjectStore(STORE); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function idbGet(){ const db=await openDb(); return new Promise((res,rej)=>{ const rq=db.transaction(STORE,'readonly').objectStore(STORE).get(DATA_KEY); rq.onsuccess=()=>res(rq.result||null); rq.onerror=()=>rej(rq.error); }); }
async function idbSet(v){ const db=await openDb(); return new Promise((res,rej)=>{ const tx=db.transaction(STORE,'readwrite'); tx.objectStore(STORE).put(v,DATA_KEY); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); }
let appData=defaultAppData();
async function loadAppData(){ try{ appData=mergeAppData(await idbGet()); }catch(e){ appData=defaultAppData(); } }
function ruleText(html){ const s=(gs&&gs.settings)||appData.settings; return String(html||'').replace(/\{選択秒\}/g, s.selectSec).replace(/\{解答秒\}/g, s.answerSec); }
function answerList(q){ return String(q.answers||'').split(/[,，、]/).map(s=>s.trim()).filter(Boolean); }
/** 正解発表で表示する正解表記（未入力なら採点用の正解の最初のもの） */
function answerLabel(q){ return String(q.answerLabel||'').trim() || answerList(q)[0] || ''; }
/** 採点用の正規化（全角半角・大小文字・カタカナ/ひらがな・空白や記号の違いを無視） */
function normAns(s){
  s=String(s||'').normalize('NFKC').toLowerCase();
  s=s.replace(/[ァ-ヶ]/g, c=>String.fromCharCode(c.charCodeAt(0)-0x60));
  return s.replace(/[\s・,.、。!！?？「」『』()（）\[\]【】'"`~〜:：;；\/／&＆＿_]/g,'');
}
function isCorrect(q, text){ const t=normAns(text); return !!t && answerList(q).some(a=>normAns(a)===t); }

/* ---------- チャーシューの配置（画像全体に均等にまぶす。チャーシュー同士の重なりはOK） ---------- */
function hashStr(s){ let h=0x811c9dc5; s=String(s||''); for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,0x01000193); } return h>>>0; }
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const imgCache=new Map();
function loadImg(src){
  if(!imgCache.has(src)) imgCache.set(src, new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=src; }));
  return imgCache.get(src);
}
/**
 * k倍（6k枚）の配置。座標 x,y は画像の幅・高さに対する割合（0〜1）、大きさ s は √(幅×高さ) に対する割合。
 * 1枚ずつ「すでに置いたチャーシュー（と画像の端）から一番遠い候補」を選ぶので、1か所に固まらず全体に散らばる。
 * 乱数の種は画像から作るので、同じ画像・同じ倍率なら必ず同じ配置になる。
 */
function layoutOne(ar, k, seed){
  const rng=mulberry32(seed), N=PER_MUL*k, W=Math.sqrt(ar), H=1/Math.sqrt(ar), pts=[];
  for(let n=0;n<N;n++){
    let bx=0, by=0, bd=-1;
    const tries=20+n;
    for(let t=0;t<tries;t++){
      const x=rng()*W, y=rng()*H;
      let d=2*Math.min(x, W-x, y, H-y)+PIECE_F*0.6;   // 端に寄りすぎないように
      for(const p of pts){ const dx=p.x-x, dy=p.y-y, v=Math.sqrt(dx*dx+dy*dy); if(v<d) d=v; }
      if(d>bd){ bd=d; bx=x; by=y; }
    }
    pts.push({x:bx, y:by});
  }
  return pts.map(p=>({ x:Math.round(p.x/W*10000)/10000, y:Math.round(p.y/H*10000)/10000,
    s:Math.round(PIECE_F*(0.9+rng()*0.2)*10000)/10000, r:Math.floor(rng()*360), f:rng()<0.5?1:0 }));
}
function layoutValid(q){ return !!(q.img && Array.isArray(q.layouts) && q.layouts.length===MAX_MUL && q.layoutV===LAYOUT_V && q.layoutHash===hashStr(q.img)); }
async function computeLayouts(q, onProgress){
  const img=await loadImg(q.img);
  const ar=img.width/img.height, base=hashStr(q.img), out=[];
  for(let k=1;k<=MAX_MUL;k++){
    out.push(layoutOne(ar, k, (base ^ Math.imul(k, 0x9E3779B1))>>>0));
    if(onProgress) onProgress(k);
    await sleep(0);
  }
  q.layouts=out; q.layoutV=LAYOUT_V; q.layoutHash=base;
}
function chashuSrc(){ return appData.chashuImg || CHASHU_DEFAULT; }
/** チャーシューの大きさ（%）。ゲーム中は開始時点の設定で固定 */
function chashuPct(){ return ((typeof gs!=='undefined' && gs && gs.settings) || appData.settings).chashuPct || 70; }
function compKey(q, k){ return q.id+'_'+k+'_'+hashStr(chashuSrc())+'_'+chashuPct(); }
/** 問題画像に k倍のチャーシューを重ねた画像（JPEG dataURL・元画像と同じサイズ） */
async function compositeUrl(q, k){
  const [qi, ci]=await Promise.all([loadImg(q.img), loadImg(chashuSrc())]);
  const w0=qi.width, h0=qi.height, unit=Math.sqrt(w0*h0);
  const c=document.createElement('canvas'); c.width=w0; c.height=h0;
  const ctx=c.getContext('2d');
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,w0,h0); ctx.drawImage(qi,0,0,w0,h0);
  const ar=ci.width/ci.height;
  (k>0 ? q.layouts[k-1] : []).forEach(p=>{
    const s=p.s*unit*chashuPct()/100;
    ctx.save(); ctx.translate(p.x*w0, p.y*h0); ctx.rotate(p.r*Math.PI/180); if(p.f) ctx.scale(-1,1);
    const w= ar>=1 ? s : s*ar, h= ar>=1 ? s/ar : s;
    ctx.shadowColor='rgba(0,0,0,.35)'; ctx.shadowBlur=unit/80; ctx.shadowOffsetY=unit/250;
    ctx.drawImage(ci,-w/2,-h/2,w,h);
    ctx.restore();
  });
  return c.toDataURL('image/jpeg', 0.86);
}

/* =========================================================
   ホスト画面
   ========================================================= */
let gs=null, peer=null, myHostId=null, tickTimer=null, audioCtx=null, beepedTimerId=null, hostOverlayK=0, scrollToTopImg=false;
const conns={}, connected=new Set(), sentImg={};
const compCache=new Map(), compPending=new Set();

function freshState(){
  return { phase:'lobby', players:{}, order:[], qids:[], qi:0, ruleSlideIndex:0, ruleRevealIndex:0,
           settings:null, round:null, rounds:[], timer:null };
}
function S(){ return gs.settings || appData.settings; }
function genRoomId(){ return ROOM_PREFIX + String(Math.floor(100000+Math.random()*900000)); }
function joinUrl(){ return myHostId ? location.origin+location.pathname+'?room='+encodeURIComponent(myHostId) : ''; }
function pname(pid){ const p=gs.players[pid]; return p?p.name:'（退出）'; }
function connectedPids(){ return gs.order.filter(pid=>gs.players[pid] && connected.has(pid)); }
function qById(id){ return appData.questions.find(q=>q.id===id); }
function curQ(){ return gs.round ? qById(gs.round.qid) : null; }
function labelFor(i){
  if(i===0) return '例題';
  const real=gs.qids.length-1;
  return i===gs.qids.length-1 ? `第${i}問（最終問題）` : `第${i}問 / 全${real}問`;
}
function totalScore(pid){ return gs.rounds.filter(r=>!r.practice).reduce((a,r)=>a+(r.pts[pid]||0),0); }
/** 同点は同順位 */
function ranking(){
  const list=gs.order.filter(p=>gs.players[p]).map(pid=>({pid, name:pname(pid), total:totalScore(pid)}));
  list.sort((a,b)=>b.total-a.total);
  list.forEach(x=>{ x.rank=1+list.filter(y=>y.total>x.total).length; });
  return list;
}

async function initHost(){
  requestWakeLock();
  await loadAppData();
  const saved=lsGet(LS.state,null), room=lsGet(LS.room,null);
  const resumable = saved && room && saved.phase!=='final' && (saved.phase!=='lobby' || Object.keys(saved.players||{}).length);
  if(resumable && confirm('前回の続きから再開しますか？\n\nOK：続きから再開（同じQRのまま）\nキャンセル：新しい部屋を作る')){
    gs=Object.assign(freshState(), saved);
    startPeer(room, 0);
  } else {
    localStorage.removeItem(LS.state); localStorage.removeItem(LS.room);
    gs=freshState();
    startPeer(null, 0);
  }
  document.getElementById('app').addEventListener('click', onHostClick);
  document.addEventListener('keydown', e=>{
    if(e.key!=='Enter' || e.isComposing) return;
    if(e.target.closest && e.target.closest('input,textarea,select,button')) return;
    if(document.querySelector('#modal-root .modal-bg, .img-modal')) return;
    const b=document.querySelector('#app [data-enter]');
    if(b && !b.disabled){ e.preventDefault(); b.click(); }
  });
  tickTimer=setInterval(tickHostTimer, 200);
  renderHost();
  ensureComposites();
}
function startPeer(roomId, retry){
  const id=roomId||genRoomId();
  if(peer){ try{ peer.destroy(); }catch(e){} }
  peer=new Peer(id);
  peer.on('open', pid=>{ myHostId=pid; lsSet(LS.room, pid); saveState(); renderHost(); });
  peer.on('connection', conn=>{
    conn.on('data', data=>handleSubMessage(conn, data));
    conn.on('close', ()=>{
      const pid=conn._pid;
      if(pid && conns[pid]===conn){ delete conns[pid]; connected.delete(pid); renderHost(); }
    });
  });
  peer.on('error', err=>{
    if(err && err.type==='unavailable-id'){
      if(roomId && retry<5){ setTimeout(()=>startPeer(roomId, retry+1), 3000); }
      else { showToast('部屋番号を新しくしました。スマホはQRから入り直してください', 5000); startPeer(null, 0); }
    } else { console.error(err); }
  });
  peer.on('disconnected', ()=>{ try{ peer.reconnect(); }catch(e){} });
}
function saveState(){ lsSet(LS.state, gs); }
function commit(){ saveState(); syncAll(); renderHost(); }
function sendTo(pid, msg){ const c=conns[pid]; if(c && c.open){ try{ c.send(msg); return true; }catch(e){} } return false; }
function syncAll(){ Object.keys(conns).forEach(pid=>sendTo(pid, snapshotFor(pid))); }
function timerInfo(){ const t=gs.timer; if(!t) return null; return { id:t.id, kind:t.kind, remainingMs:Math.max(0, t.endsAt-Date.now()) }; }

/** 参加者に送る画面情報（参加者は毎回これで上書きするだけ。得点もホストが計算） */
function snapshotFor(pid){
  const r=gs.round, ph=gs.phase, q=curQ();
  const o={ type:'state', phase:ph, name:pname(pid), label:r?r.label:'', practice:r?!!r.practice:false,
            roundId:r?r.id:null, total:totalScore(pid), selectSec:S().selectSec, answerSec:S().answerSec };
  if(r){
    o.myPick = r.picks[pid]!=null ? r.picks[pid] : null;
    o.correct = r.correct[pid]!=null;
    o.wrong = r.wrong[pid]||0;
  }
  if((ph==='select'||ph==='answer') && gs.timer) o.timer=timerInfo();
  if((ph==='answer'||ph==='answered') && q && o.myPick){
    o.qtext=q.text||'';
    const key=compKey(q, o.myPick);
    const url=compCache.get(key);
    if(url){ o.imgKey=key; if(sentImg[pid]!==key){ o.img=url; sentImg[pid]=key; } }
  }
  if(ph==='reveal' && r && r.recorded){
    const x=gs.rounds[gs.rounds.length-1];
    o.earned=x.pts[pid]||0; o.answer=answerLabel(q);
  }
  if(ph==='final'){ const me=ranking().find(x=>x.pid===pid); o.rank=me?me.rank:null; o.count=ranking().length; }
  return o;
}
function handleSubMessage(conn, data){
  if(!data || !data.type) return;
  if(data.type==='join'){
    let pid=String(data.pid||''); const name=String(data.name||'').trim().slice(0,12);
    if(!pid || !name) return;
    if(!gs.players[pid]){
      // タブを閉じて入り直した人：同じニックネームで切断中の人がいれば、その人として復帰
      const same=gs.order.find(p=>gs.players[p] && gs.players[p].name===name);
      if(same && !connected.has(same)){
        gs.players[pid]=gs.players[same]; delete gs.players[same];
        gs.order=gs.order.map(p=>p===same?pid:p);
        const ren=obj=>{ if(obj && obj[same]!==undefined){ obj[pid]=obj[same]; delete obj[same]; } };
        if(gs.round){ ren(gs.round.picks); ren(gs.round.correct); ren(gs.round.wrong); }
        gs.rounds.forEach(x=>{ ren(x.picks); ren(x.correct); ren(x.pts); });
      } else if(same){ try{ conn.send({type:'name_taken'}); }catch(e){} return; }
      else { gs.players[pid]={name}; gs.order.push(pid); }
    } else {
      if(gs.order.some(p=>p!==pid && gs.players[p] && gs.players[p].name===name)){ try{ conn.send({type:'name_taken'}); }catch(e){} return; }
      gs.players[pid].name=name;
    }
    const old=conns[pid];
    conn._pid=pid; conns[pid]=conn; connected.add(pid); delete sentImg[pid];
    if(old && old!==conn){ try{ old.close(); }catch(e){} }
    // 解答中に入ってきた人で倍率が決まっていない人は1倍
    if(gs.round && ['selected','answer','answered'].includes(gs.phase) && gs.round.picks[pid]==null){ gs.round.picks[pid]=1; ensureComposites(); }
    commit();
    return;
  }
  const pid=conn._pid; if(!pid || !gs.players[pid]) return;
  const r=gs.round;
  if(data.type==='pick'){
    if(gs.phase!=='select' || !r || data.roundId!==r.id || r.picks[pid]!=null) return;
    const k=toInt(data.k); if(isNaN(k)||k<1||k>MAX_MUL) return;
    r.picks[pid]=k;
    if(connectedPids().every(p=>r.picks[p]!=null)) closeSelect(); else commit();
  }
  else if(data.type==='answer'){
    if(gs.phase!=='answer' || !r || data.roundId!==r.id || r.correct[pid]!=null) return;
    if(r.picks[pid]==null) r.picks[pid]=1;
    const q=curQ(), text=String(data.text||'').slice(0,60);
    const ok=isCorrect(q, text);
    if(ok) r.correct[pid]=Date.now()-r.answerStartAt;
    else r.wrong[pid]=(r.wrong[pid]||0)+1;
    sendTo(pid, {type:'judge', ok, text});
    if(ok && connectedPids().every(p=>r.correct[p]!=null)) closeAnswer(); else commit();
  }
}

/* ----- 合成画像（参加者ごとの倍率） ----- */
function ensureComposites(){
  const r=gs&&gs.round, q=curQ();
  if(!r || !q || !layoutValid(q) || !['selected','answer','answered'].includes(gs.phase)) return;
  const ks=[...new Set(Object.values(r.picks))];
  ks.forEach(k=>{
    const key=compKey(q, k);
    if(compCache.has(key) || compPending.has(key)) return;
    compPending.add(key);
    compositeUrl(q, k).then(url=>{ compCache.set(key, url); compPending.delete(key); syncAll(); })
      .catch(()=>{ compPending.delete(key); showToast('画像の合成に失敗しました'); });
  });
}
async function hostComposite(q, k){
  const key=compKey(q, k);
  if(!compCache.has(key)) compCache.set(key, await compositeUrl(q, k));
  return compCache.get(key);
}

/* ----- 進行 ----- */
async function startGame(withRule){
  if(connectedPids().length<MIN_PLAYERS){ alert(`参加者が${MIN_PLAYERS}人以上必要です`); return; }
  await loadAppData();
  const qs=appData.questions.filter(q=>q.include && q.img && answerList(q).length);
  if(!qs.length){ alert('出題できる問題がありません。\n管理ページで、問題画像と正解を登録して「出題する」にチェックを入れてください。'); return; }
  // 配置が未計算の問題があれば計算して保存（同じ画像なら毎回同じ配置）
  const need=qs.filter(q=>!layoutValid(q));
  if(need.length){
    const ov=document.getElementById('save-overlay'); ov.classList.add('active');
    document.getElementById('save-msg').textContent='チャーシューの配置を計算中…';
    for(let i=0;i<need.length;i++){
      await computeLayouts(need[i], k=>{ const p=((i+k/MAX_MUL)/need.length)*100; document.getElementById('save-bar').style.width=p+'%'; document.getElementById('save-pct').textContent=Math.round(p)+'%'; });
    }
    try{ await idbSet(appData); }catch(e){}
    ov.classList.remove('active');
  }
  gs.settings=JSON.parse(JSON.stringify(appData.settings));
  gs.qids=qs.map(q=>q.id); gs.qi=0; gs.rounds=[]; gs.round=null; gs.timer=null;
  const hasRule=appData.ruleSlides.some(s=>s.img || s.groups.some(g=>stripHtml(g)));
  gs.ruleDemo=null; gs.ruleDemoDone=false;
  if(withRule && hasRule){ gs.phase='rule'; gs.ruleSlideIndex=0; gs.ruleRevealIndex=0; }
  else gs.phase='ready';
  commit();
}
/* ----- ルール説明中の「例題の画像紹介」（通常の画像 → 1倍 → 2〜12倍まとめて） ----- */
function exampleQ(){ const q=gs.qids.length ? qById(gs.qids[0]) : null; return q && layoutValid(q) ? q : null; }
/** 画像紹介を入れるルール説明のページ番号（0始まり。入れない時は -1） */
function demoSlideIndex(){
  const n=appData.ruleSlides.length, a=S().demoAfter;
  if(!exampleQ() || a===0) return -1;
  return a<0 || a>n ? n-1 : a-1;
}
function advanceRule(){
  const slides=appData.ruleSlides, slide=slides[gs.ruleSlideIndex];
  const nextSlide=()=>{ if(gs.ruleSlideIndex < slides.length-1){ gs.ruleSlideIndex++; gs.ruleRevealIndex=0; } else gs.phase='ready'; };
  if(gs.ruleDemo!=null){
    if(gs.ruleDemo<2) gs.ruleDemo++;
    else { gs.ruleDemo=null; gs.ruleDemoDone=true; nextSlide(); }
  }
  else if(gs.ruleRevealIndex < slide.groups.length-1) gs.ruleRevealIndex++;
  else if(gs.ruleSlideIndex===demoSlideIndex() && !gs.ruleDemoDone) gs.ruleDemo=0;
  else nextSlide();
  commit();
}
function retreatRule(){
  const slides=appData.ruleSlides;
  if(gs.ruleDemo!=null){ if(gs.ruleDemo>0) gs.ruleDemo--; else gs.ruleDemo=null; }
  else if(gs.ruleRevealIndex>0) gs.ruleRevealIndex--;
  else if(gs.ruleSlideIndex>0){
    gs.ruleSlideIndex--; gs.ruleRevealIndex=slides[gs.ruleSlideIndex].groups.length-1;
    if(gs.ruleSlideIndex===demoSlideIndex()){ gs.ruleDemo=2; gs.ruleDemoDone=false; }
  }
  commit();
}
function startTimer(kind, sec){ gs.timer={ id:uid(), kind, endsAt:Date.now()+sec*1000 }; }
function startSelect(){
  if(gs.phase!=='ready') return;
  const qid=gs.qids[gs.qi];
  gs.round={ id:uid(), qid, label:labelFor(gs.qi), practice:gs.qi===0, picks:{}, correct:{}, wrong:{}, answerStartAt:null, revealStep:0, recorded:false };
  hostOverlayK=0;
  gs.phase='select'; startTimer('select', S().selectSec);
  commit();
}
function closeSelect(){
  if(gs.phase!=='select') return;
  const r=gs.round;
  connectedPids().forEach(p=>{ if(r.picks[p]==null) r.picks[p]=1; });   // 時間内に決めなかった人は1倍
  gs.phase='selected'; gs.timer=null;
  commit(); ensureComposites();
}
function startAnswer(){
  if(gs.phase!=='selected') return;
  const r=gs.round;
  connectedPids().forEach(p=>{ if(r.picks[p]==null) r.picks[p]=1; });
  r.answerStartAt=Date.now();
  gs.phase='answer'; startTimer('answer', S().answerSec);
  commit(); ensureComposites();
}
function closeAnswer(){
  if(gs.phase!=='answer') return;
  gs.phase='answered'; gs.timer=null;
  commit();
}
async function goReveal(){
  if(gs.phase!=='answered') return;
  const r=gs.round, q=curQ();
  if(!r.recorded){
    const pts={};
    Object.keys(r.picks).forEach(pid=>{ pts[pid] = r.correct[pid]!=null ? r.picks[pid] : 0; });
    gs.rounds.push({ id:r.id, qid:r.qid, label:r.label, practice:r.practice, picks:{...r.picks}, correct:{...r.correct}, pts });
    r.recorded=true;
    // 出題済みにチェック
    if(q && !q.done){ q.done=true; try{ const d=mergeAppData(await idbGet()); const dq=d.questions.find(x=>x.id===q.id); if(dq){ dq.done=true; await idbSet(d); } }catch(e){} }
  }
  hostOverlayK=0;
  gs.phase='reveal'; r.revealStep=0;
  commit();
}
function nextQuestion(){
  if(gs.phase!=='reveal') return;
  if(gs.qi>=gs.qids.length-1){ goFinal(); return; }
  gs.qi++; gs.round=null; gs.phase='ready';
  commit();
}
function goFinal(){
  gs.phase='final'; gs.round=null; gs.timer=null;
  commit();
  localStorage.removeItem(LS.state);   // ゲーム終了：次回は新規から
}
function playAgain(){
  gs.phase='lobby'; gs.rounds=[]; gs.round=null; gs.timer=null; gs.qi=0; gs.qids=[]; gs.settings=null;
  commit();
}

/* ----- タイマー ----- */
function beep(){
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    [0,0.35,0.7].forEach(off=>{
      const o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.frequency.value=880; o.connect(g); g.connect(audioCtx.destination);
      const t=audioCtx.currentTime+off; g.gain.setValueAtTime(0.25,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.3);
      o.start(t); o.stop(t+0.3);
    });
  }catch(e){}
}
function tickHostTimer(){
  if(!gs || !gs.timer) return;
  const ms=gs.timer.endsAt-Date.now();
  const el=document.getElementById('host-timer');
  if(el){ el.innerHTML=`${Math.max(0,Math.ceil(ms/1000))}<span class="unit">秒</span>`; el.classList.toggle('zero', ms<=0); }
  if(ms<=0 && beepedTimerId!==gs.timer.id){ beepedTimerId=gs.timer.id; if(ms>-3000) beep(); }
  if(ms<=-700){   // 通信の遅れを考えて少しだけ待ってから締め切る
    if(gs.phase==='select') closeSelect();
    else if(gs.phase==='answer') closeAnswer();
  }
}

function openQrModal(){
  if(!myHostId){ showToast('部屋を準備中です'); return; }
  const m=openModal(`<h3>参加用QRコード</h3><div style="text-align:center"><div class="qrbox" id="qr-modal"></div><div class="url" style="color:#666">${esc(joinUrl())}</div></div>`);

function kickPlayer(pid){
  if(!gs.players[pid] || !confirm(`${pname(pid)}さんを参加者から外しますか？`)) return;
  sendTo(pid, {type:'removed'});
  const c=conns[pid]; delete conns[pid]; connected.delete(pid);
  delete gs.players[pid];
  gs.order=gs.order.filter(p=>p!==pid);
  setTimeout(()=>{ try{ c&&c.close(); }catch(err){} }, 300);
  commit();
}

function onHostClick(e){
  const b=e.target.closest('[data-act]');
  if(!b || b.disabled) return;
  const act=b.dataset.act;
  try{ audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended') audioCtx.resume(); }catch(err){}
  if(act==='qr') openQrModal();
  else if(act==='admin'){ if(gs.phase==='lobby' || confirm('管理ページを開きますか？\n（ゲームの進行状況は保存されます。戻ると「続きから再開」できます）')) location.href=location.pathname+'?mode=admin'; }
  else if(act==='newroom'){
    if(!confirm('新しい部屋を作り直しますか？\n（今の進行状況は消え、スマホはQRから入り直しになります）')) return;
    localStorage.removeItem(LS.state); localStorage.removeItem(LS.room);
    location.reload();
  }
  else if(act==='kick') kickPlayer(b.dataset.pid);
  else if(act==='start') startGame(true);
  else if(act==='start-norule') startGame(false);
  else if(act==='rule-next') advanceRule();
  else if(act==='rule-prev') retreatRule();
  else if(act==='rule-skip'){ gs.phase='ready'; commit(); }
  else if(act==='select'){ b.disabled=true; startSelect(); }
  else if(act==='close-select'){ if(confirm('倍率の選択を締め切りますか？\n（まだ決めていない人は1倍になります）')) closeSelect(); }
  else if(act==='answer'){ b.disabled=true; startAnswer(); }
  else if(act==='close-answer'){ if(confirm('解答を締め切りますか？')) closeAnswer(); }
  else if(act==='reveal'){ b.disabled=true; goReveal(); }
  else if(act==='reveal-ans'){ gs.round.revealStep=1; commit(); }
  else if(act==='reveal-top'){ gs.round.revealStep=2; commit(); }
  else if(act==='top-img'){
    scrollToTopImg=true; gs.round.topImg=true; commit();
  }
  else if(act==='ov'){ hostOverlayK=Number(b.dataset.k); renderHost(); }
  else if(act==='next') nextQuestion();
  else if(act==='final'){ if(confirm('ここでゲームを終了して結果発表に進みますか？')) goFinal(); }
  else if(act==='again') playAgain();
}

/** 参加者タイル。mode: select / selected / answer */
function tilesHtml(mode){
  const r=gs.round;
  let pids=gs.order.filter(p=>gs.players[p] && (connected.has(p) || (r && r.picks[p]!=null)));
  if(mode!=='select') pids=pids.slice().sort((a,b)=>(r.picks[b]||0)-(r.picks[a]||0));
  const okOrder=Object.entries(r.correct).sort((a,b)=>a[1]-b[1]).map(x=>x[0]);
  return `<div class="tiles">${pids.map(pid=>{
    const k=r.picks[pid], on=connected.has(pid);
    let st='', cls='';
    if(mode==='select') st = k!=null ? '✔ 決定済み' : '…選択中';
    else if(mode==='selected') st = `チャーシュー${(k||1)*PER_MUL}枚`;
    else { const ok=r.correct[pid]!=null; if(ok){ cls='ok'; st=`✅ 正解（${okOrder.indexOf(pid)+1}番目・${(r.correct[pid]/1000).toFixed(1)}秒）`; } else st = r.wrong[pid] ? `解答中…（✕${r.wrong[pid]}回）` : '解答中…'; }
    return `<div class="tile ${cls} ${on?'':'off'}"><div class="nm"><span class="dot ${on?'on':''}"></span> ${esc(pname(pid))}</div>
      ${mode==='select' ? '' : `<div class="mul">${k||1}倍</div>`}<div class="st">${st}</div></div>`;
  }).join('')}</div>`;
}

let myPeer=null, myConn=null, myPid='', myName='', sub=null, removedByHost=false, subTimerEnds=null, lastViewKey='';

  renderConnecting();
  setInterval(tickSubTimer, 250);
  myPeer=new Peer();
  myPeer.on('open', ()=>connectToHost(params.get('room')));
  myPeer.on('disconnected', ()=>{ try{ myPeer.reconnect(); }catch(e){} });
  myPeer.on('error', err=>console.error(err));
  const app=document.getElementById('app');
  app.addEventListener('click', onSubClick);
  app.addEventListener('change', e=>{ if(e.target.id==='pick-sel') subPickVal=e.target.value; });
  app.addEventListener('keydown', e=>{ if(e.target.id==='ans-input' && e.key==='Enter' && !e.isComposing){ e.preventDefault(); submitAnswer(); } });
}
function connectToHost(roomId){
  let timer=null;
  const retry=()=>{ if(removedByHost) return; clearTimeout(timer); timer=setTimeout(tryConnect, 3000); };
  function tryConnect(){
    if(removedByHost) return;
    try{
      const conn=myPeer.connect(roomId, {reliable:true});
      myConn=conn;
      conn.on('open', ()=>{ if(myName) sendJoin(); else renderNameForm(''); });
      conn.on('data', handleHostMessage);
      conn.on('close', ()=>{ if(myConn===conn){ lastViewKey=''; renderConnecting(); retry(); } });
      conn.on('error', ()=>{ if(myConn===conn) retry(); });
      setTimeout(()=>{ if(myConn===conn && !conn.open){ try{ conn.close(); }catch(e){} retry(); } }, 8000);
    }catch(e){ retry(); }
  }
  tryConnect();
}
function sendHost(msg){ if(myConn && myConn.open){ try{ myConn.send(msg); return true; }catch(e){} } showToast('通信が切れています。再接続をお待ちください'); return false; }
function sendJoin(){ sendHost({type:'join', pid:myPid, name:myName}); }
function renderConnecting(){
  document.getElementById('app').innerHTML=`<div class="page"><div class="p-center"><div class="spinner"></div>
    <p>ホスト画面に接続しています…</p><p class="muted" style="font-size:13px">つながらない場合はそのまま少しお待ちください（自動で再接続します）</p></div></div>`;
}

    <p class="muted" style="font-size:13px">途中で画面を閉じてしまった場合は、同じニックネームで入り直すと復帰できます</p>
  </div></div>`;

function handleHostMessage(data){
  if(!data) return;
  if(data.type==='state'){
    if(data.img && data.imgKey) subImgs[data.imgKey]=data.img;
    if(!sub || sub.roundId!==data.roundId){ subPickVal=''; subJudge=null; }
    sub=data;
    subTimerEnds = data.timer ? Date.now()+data.timer.remainingMs : null;
    renderSub();
  } else if(data.type==='judge'){
    if(!data.ok){
      subJudge={ok:false, text:data.text};
      const j=document.getElementById('judge');
      if(j){ j.className='judge ng'; j.textContent=`✕「${data.text}」は不正解… もう一度！`; }
      const box=document.getElementById('ans-area'); if(box){ box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake'); }
      const inp=document.getElementById('ans-input'); if(inp){ inp.value=''; inp.focus(); }
    }
  } else if(data.type==='name_taken'){
    myName=''; sessionStorage.removeItem(SS_NAME);
    renderNameForm('そのニックネームは使われています。別のニックネームにしてください');
  } else if(data.type==='removed'){
    removedByHost=true; sessionStorage.removeItem(SS_NAME); sessionStorage.removeItem(SS_PID);
    document.getElementById('app').innerHTML=`<div class="page"><div class="p-center"><h2>参加者から外れました</h2><p>もう一度参加する場合はQRコードを読み直してください。</p></div></div>`;
  }
}
function tickSubTimer(){
  const el=document.getElementById('sub-timer'); if(!el || subTimerEnds==null) return;
  const ms=Math.max(0, subTimerEnds-Date.now());
  el.textContent = ms<=0 ? '⏰ 時間です' : `残り ${Math.ceil(ms/1000)}秒`;
  el.classList.toggle('zero', ms<=0);
}
function onSubClick(e){
  const b=e.target.closest('[data-sact]'); if(!b || b.disabled) return;
  const act=b.dataset.sact;
  if(act==='pick'){
    const k=toInt(subPickVal);
    if(isNaN(k)){ alert('倍率を選んでください'); return; }
    if(!confirm(`${k}倍（チャーシュー${k*PER_MUL}枚）で決定しますか？\n決定後は変更できません。`)) return;
    sendHost({type:'pick', k, roundId:sub.roundId});
  }
  else if(act==='answer') submitAnswer();
}
function submitAnswer(){
  const inp=document.getElementById('ans-input'); if(!inp) return;
  const v=inp.value.trim();
  if(!v){ inp.focus(); return; }
  if(sendHost({type:'answer', text:v, roundId:sub.roundId})){
    const j=document.getElementById('judge'); if(j){ j.className='judge'; j.textContent='判定中…'; }
  }
}
function renderSub(){
  const s=sub; if(!s) return;
  const img = s.imgKey ? subImgs[s.imgKey] : null;
  // 入力中の文字やプルダウンが消えないよう、画面の中身が変わる時だけ描き直す
  const viewKey=JSON.stringify([s.phase,s.roundId,s.myPick,s.correct,s.label,s.total,s.earned,s.rank,!!img,s.name,s.qtext]);
  if(viewKey===lastViewKey){ tickSubTimer(); return; }
  lastViewKey=viewKey;
  const app=document.getElementById('app');
  const head=`<div class="sub-head"><div>${esc(s.name)} さん</div><div>${s.label?esc(s.label):''}　合計 ${s.total}点</div></div>`;
  let html='';
  const timer=`<div class="p-timer" id="sub-timer"></div>`;
  if(s.phase==='select'){
    if(s.myPick!=null){
      html=`<div class="p-item"><div class="lbl">あなたの倍率</div><div class="p-big">${s.myPick}倍</div><div>チャーシュー ${s.myPick*PER_MUL}枚</div></div>
        <div class="p-center" style="padding-top:10px"><h3>決定しました！</h3><p>ホストの画面を見てください</p></div>`;
    } else {
      html=`<h2 style="text-align:center">🥩 チャーシューを何倍にする？</h2>${timer}
        <p class="muted" style="font-size:14px;text-align:center;margin-top:0">倍率が高いほど画像が見えにくくなりますが、正解すると倍率がそのまま得点です${s.practice?'（例題なので得点は入りません）':''}</p>
        <select class="sub-sel" id="pick-sel"><option value="">― 倍率を選ぶ ―</option>
          ${Array.from({length:MAX_MUL},(_,i)=>`<option value="${i+1}" ${String(i+1)===subPickVal?'selected':''}>${i+1}倍（チャーシュー${(i+1)*PER_MUL}枚）</option>`).join('')}</select>
        <button class="primary sub-btn" data-sact="pick">この倍率で決定</button>`;
    }
  }
  else if(s.phase==='selected'){
    html=`<div class="p-item"><div class="lbl">あなたの倍率</div><div class="p-big">${s.myPick||'-'}倍</div><div>チャーシュー ${(s.myPick||0)*PER_MUL}枚</div></div>
      <div class="p-center" style="padding-top:10px"><h3>まもなく解答開始！</h3><p>ホストの画面を見てください</p></div>`;
  }
  else if(s.phase==='answer' || s.phase==='answered'){
    const imgHtml = img ? `<img class="sub-img" src="${img}" draggable="false">` : `<div class="p-center"><div class="spinner"></div><p>画像を受信中…</p></div>`;
    if(s.correct){
      html=`<div class="ok-banner">⭕ 正解！ ${s.practice?'（例題なので得点なし）':`＋${s.myPick}点`}</div>${imgHtml}
        <p style="text-align:center">ホストの画面を見てください</p>`;
    } else if(s.phase==='answered'){
      html=`<div class="p-item"><div class="p-big" style="font-size:36px;color:var(--danger)">⏰ 時間切れ</div></div>${imgHtml}<p style="text-align:center">ホストの画面を見てください</p>`;
    } else {
      html=`${timer}${s.qtext?`<div style="font-weight:900;font-size:18px;text-align:center;margin-bottom:6px">${esc(s.qtext)}</div>`:''}
        ${imgHtml}
        <div id="ans-area"><input type="text" id="ans-input" placeholder="答えを入力" autocomplete="off" autocapitalize="off" enterkeyhint="send" style="font-size:20px;padding:12px">
        <button class="primary sub-btn" data-sact="answer">送信</button></div>
        <div class="judge ${subJudge&&!subJudge.ok?'ng':''}" id="judge">${subJudge&&!subJudge.ok?`✕「${esc(subJudge.text)}」は不正解… もう一度！`:''}</div>
        <p class="muted" style="font-size:13px;text-align:center">${s.myPick}倍（${s.myPick*PER_MUL}枚）／間違えても時間内なら何回でも答えられます</p>`;
    }
  }
  else if(s.phase==='reveal'){
    html=`<div class="p-center">${s.earned!=null ? (s.correct ? `<h2 style="color:var(--ok)">⭕ 正解！</h2><div class="p-big">${s.practice?'—':'+'+s.earned+'点'}</div>` : `<h2>✕ 残念…</h2>`) : ''}
      <p style="font-size:18px">合計 <b>${s.total}点</b></p><p>ホストの画面を見てください</p></div>`;
  }
  else if(s.phase==='final'){
    html=`<div class="p-center"><h2>🏆 結果発表</h2>${s.rank?`<div class="p-big">${s.rank}位</div><p style="font-size:20px">${s.total}点（${s.count}人中）</p>`:''}<p>ホストの画面を見てください</p></div>`;
  }
  else {
    html=`<div class="p-center"><h2>${esc(s.name)} さん、ようこそ！</h2><p style="font-size:18px">ホストの画面を見てください</p>
      <p class="muted" style="font-size:14px">出題の前に、このスマホでチャーシューの倍率を決めます</p></div>`;
  }
  // 入力中の解答は描き直しても残す
  const oldInp=document.getElementById('ans-input'), keep=oldInp?oldInp.value:'', hadFocus=oldInp && document.activeElement===oldInp;
  app.innerHTML=`<div class="page">${head}${html}</div>`;
  const inp=document.getElementById('ans-input');
  if(inp){ inp.value=keep; if(hadFocus) inp.focus(); }
  tickSubTimer();
}

function readFileUrl(f){ return new Promise((res,rej)=>{ const rd=new FileReader(); rd.onload=()=>res(rd.result); rd.onerror=rej; rd.readAsDataURL(f); }); }
function qHeadTitle(q,i){ return `問${i+1}：${q.text||answerLabel(q)||'（未設定）'}`; }

function renderConfirm(){
  const inc=appData.questions.filter(q=>q.include);
  document.getElementById('confirm-list').innerHTML = inc.length ? inc.map((q,i)=>`<div class="confirm-row">
      <b style="width:110px">${i===0?'<span class="tag practice">例題</span>':`第${i}問${i===inc.length-1&&i>0?'（最終）':''}`}</b>

function onQInput(e){
  const f=e.target.dataset.qf; if(!f || e.target.type==='checkbox') return;
  const blk=e.target.closest('.q-block'), i=Number(blk.dataset.qi), q=appData.questions[i];
  q[f]=e.target.value;
  blk.querySelector('.q-title').textContent=qHeadTitle(q,i);
  renderConfirm();
}
async function onQChange(e){
  const blk=e.target.closest('.q-block'); if(!blk) return;
  const i=Number(blk.dataset.qi), q=appData.questions[i];
  if(e.target.type==='checkbox' && e.target.dataset.qf){ q[e.target.dataset.qf]=e.target.checked; renderConfirm(); return; }
  if(e.target.dataset.qactFile){
    const f=e.target.files[0]; if(!f) return;
    try{
      const url=await readFileUrl(f), im=await loadImg(url);
      const sc=Math.min(1, IMG_MAX/Math.max(im.width, im.height)), w=Math.round(im.width*sc), h=Math.round(im.height*sc);
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      const ctx=c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h);
      ctx.imageSmoothingQuality='high'; ctx.drawImage(im,0,0,w,h);
      q.img=c.toDataURL('image/jpeg', 0.92);
      if(sc<1) showToast(`${im.width}×${im.height}px の画像を ${w}×${h}px に縮小して保存します`, 3500);
      q.layouts=null;
      openQ.add(q.id); renderQuestions();
      const st=document.querySelector(`.q-block[data-qi="${i}"] .layout-st`);
      await computeLayouts(q, k=>{ if(st) st.textContent=`配置を計算中… ${k}/${MAX_MUL}`; });
      renderQuestions();
      showToast('チャーシューの配置を決めました（保存ボタンで保存）');
    }catch(err){ alert('画像を読み込めませんでした'); }
  }
}
async function showPreview(q){
  const grid=document.querySelector(`.prev-grid[data-prev="${q.id}"]`); if(!grid) return;
  if(!layoutValid(q)){ grid.innerHTML='<p class="muted">配置を計算中…</p>'; await computeLayouts(q); renderQuestions(); return showPreview(q); }
  if(grid.querySelectorAll('img[data-k]').length!==MAX_MUL) grid.innerHTML=`<figure><img src="${q.img}">元の画像</figure>`+Array.from({length:MAX_MUL},(_,i)=>`<figure><img data-k="${i+1}" src="data:image/gif;base64,R0lGODlhAQABAAAAACwAAAAAAQABAAA=">${i+1}倍（${(i+1)*PER_MUL}枚）</figure>`).join('');
  for(let k=1;k<=MAX_MUL;k++){
    const url=await compositeUrl(q, k);
    const el=grid.querySelector(`img[data-k="${k}"]`); if(el) el.src=url;
    await sleep(0);
  }
}
function collectAdmin(){
  appData.memo=document.getElementById('memo').value;
  document.querySelectorAll('#rule-editor .rule-group-edit').forEach(el=>{
    const si=Number(el.closest('.rule-slide-card').dataset.si), gi=Number(el.closest('.rule-group-block').dataset.gi);
    appData.ruleSlides[si].groups[gi]=el.innerHTML;
  });
  const a=toInt(document.getElementById('s-select').value), b=toInt(document.getElementById('s-answer').value);
  const c=toInt(document.getElementById('s-size').value);
  const errors=[];
  if(isNaN(a)||a<1) errors.push('倍率を決める時間は1以上の整数で入力してください');
  if(isNaN(b)||b<1) errors.push('解答時間は1以上の整数で入力してください');
  if(isNaN(c)||c<20||c>200) errors.push('チャーシューの大きさは20〜200（%）の整数で入力してください');
  const dm=toInt(document.getElementById('s-demo').value);
  if(!errors.length) appData.settings={selectSec:a, answerSec:b, chashuPct:c, demoAfter:isNaN(dm)?-1:dm};
  return errors;
}
async function saveAdmin(go){
  const errors=collectAdmin();
  if(errors.length){ alert('設定を確認してください\n\n・'+errors.join('\n・')); return; }
  const warn=appData.questions.map((q,i)=>q.include && (!q.img || !answerList(q).length) ? `問${i+1}：${!q.img?'画像':''}${!q.img&&!answerList(q).length?'・':''}${!answerList(q).length?'正解':''}が未登録` : '').filter(Boolean);
  if(warn.length && !confirm('次の問題は出題されません。このまま保存しますか？\n\n'+warn.join('\n'))) return;
  const ov=document.getElementById('save-overlay'), bar=document.getElementById('save-bar'), pct=document.getElementById('save-pct'), msg=document.getElementById('save-msg');
  const prog=(p,m)=>{ bar.style.width=p+'%'; pct.textContent=Math.round(p)+'%'; if(m) msg.textContent=m; };
  ov.classList.add('active'); prog(5,'保存中…');
  try{
    const need=appData.questions.filter(q=>q.img && !layoutValid(q));
    for(let i=0;i<need.length;i++) await computeLayouts(need[i], k=>prog(5+80*((i+k/MAX_MUL)/need.length), `チャーシューの配置を計算中…（${i+1}/${need.length}）`));
    const big=appData.ruleSlides.filter(sl=>sl.img && sl.img.length>600000);
    for(let i=0;i<big.length;i++) big[i].img=await compressDataUrl(big[i].img);
    prog(90,'保存中…');
    await idbSet(appData);
    prog(100,'保存しました');
    await sleep(400);
  }catch(err){ alert('保存に失敗しました'); ov.classList.remove('active'); return; }
  ov.classList.remove('active');
  renderQuestions();
  if(go) location.href=location.pathname; else showToast('保存しました');
}
function compressDataUrl(src, maxDim, quality){
  maxDim=maxDim||1000; quality=quality||0.8;
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>{
      let w=img.width,h=img.height;
      if(w>h){ if(w>maxDim){h=Math.round(h*maxDim/w);w=maxDim;} } else { if(h>maxDim){w=Math.round(w*maxDim/h);h=maxDim;} }
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      resolve(c.toDataURL('image/jpeg',quality));
    };
    img.onerror=reject; img.src=src;
  });
}
function compressImageFile(file){ return readFileUrl(file).then(u=>compressDataUrl(u)); }

function onAdminClick(e){
  const qb=e.target.closest('[data-qact]');
  if(qb && !qb.disabled){
    if(e.target.closest('.hchk') || (e.target.closest('.q-drag'))) return;
    const blk=qb.closest('.q-block'), i=Number(blk.dataset.qi), qs=appData.questions, q=qs[i], act=qb.dataset.qact;
    if(act==='toggle'){ if(openQ.has(q.id)) openQ.delete(q.id); else openQ.add(q.id); blk.querySelector('.q-body').classList.toggle('open'); return; }
    e.stopPropagation();
    if(act==='up'){ [qs[i-1],qs[i]]=[qs[i],qs[i-1]]; renderQuestions(); }
    else if(act==='down'){ [qs[i+1],qs[i]]=[qs[i],qs[i+1]]; renderQuestions(); }
    else if(act==='del'){ if(confirm('この問題を削除しますか？')){ qs.splice(i,1); renderQuestions(); } }
    else if(act==='preview') showPreview(q);
    return;
  }
  const b=e.target.closest('[data-act]'); if(!b || b.disabled) return;
  const act=b.dataset.act;
  if(act==='tohost') location.href=location.pathname;
  else if(act==='save') saveAdmin(false);
  else if(act==='save-go') saveAdmin(true);
  else if(act==='q-add'){ const q=newQuestion(); appData.questions.push(q); openQ.add(q.id); renderQuestions(); }
  else if(act==='chashu-default'){ appData.chashuImg=null; document.getElementById('chashu-prev').src=chashuSrc(); b.remove(); document.querySelectorAll('.prev-grid').forEach(g=>g.innerHTML=''); }
  else if(act==='export'){
    collectAdmin();
    const data={app:'chashu12', version:1, exportedAt:new Date().toISOString(), appData};
    const blob=new Blob([JSON.stringify(data)], {type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    const d=new Date(); a.download=`chashu12quiz_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.json`;
    a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
  }
  else if(act==='import') document.getElementById('import-file').click();
}
function onImportFile(e){
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=async ()=>{
    try{
      const d=JSON.parse(rd.result);
      if(d.app!=='chashu12' || !d.appData) throw new Error('format');
      if(!confirm('読み込んだデータで、今のデータ（メモ・設定・ルール説明・問題）を上書きしますか？')) return;
      await idbSet(mergeAppData(d.appData));
      alert('読み込みました'); location.reload();
    }catch(err){ alert('このファイルは読み込めませんでした'); }
  };
  rd.readAsText(f);
  e.target.value='';
}

/* ---- ルール説明エディタ（複数ページ・段階表示・書式ツールバー） ---- */
/** 「例題の画像紹介」の位置の選択肢（ルール説明のページ数に合わせて作り直す） */
function renderDemoSelect(){
  const sel=document.getElementById('s-demo'); if(!sel) return;
  const n=appData.ruleSlides.length;
  let cur=sel.options.length ? toInt(sel.value) : appData.settings.demoAfter;
  if(isNaN(cur) || cur>n) cur=-1;
  const opts=[[-1,'ルール説明の最後（例題の直前）'], ...Array.from({length:Math.max(0,n-1)},(_,i)=>[i+1,`ルール説明のページ${i+1}の後`]), [0,'入れない']];
  sel.innerHTML=opts.map(([v,t])=>`<option value="${v}" ${v===cur?'selected':''}>${t}</option>`).join('');
}
function renderRuleSlidesEditor(){
  renderDemoSelect();
  const slides=appData.ruleSlides;
  document.getElementById('rule-editor').innerHTML = slides.map((slide,si)=>`
    <div class="rule-slide-card" data-si="${si}">
      <div class="row" style="margin-bottom:8px">
        <b>ページ${si+1}</b>
        <button type="button" class="small" data-ract="slide-up" ${si===0?'disabled':''}>🔼</button>
        <button type="button" class="small" data-ract="slide-down" ${si===slides.length-1?'disabled':''}>🔽</button>
        <button type="button" class="small ghost" data-ract="slide-del" ${slides.length<=1?'disabled':''}>🗑 ページ削除</button>
      </div>
      <div class="row" style="margin-bottom:8px">
        <span class="muted" style="font-size:13px">画像：</span><input type="file" accept="image/*" data-ract="slide-img-input">
        ${slide.img?`<img class="thumb" src="${slide.img}"><button type="button" class="small ghost" data-ract="slide-img-remove">画像を削除</button>`:''}
      </div>
      ${slide.groups.map((g,gi)=>`
        <div class="rule-group-block" data-gi="${gi}">
          <div class="rich-toolbar">
            <span class="muted" style="font-size:12px;margin-right:4px">段${gi+1}</span>
            <button type="button" data-ract="fmt" data-cmd="bold">太字</button>
            <button type="button" data-ract="fmt" data-cmd="colorclass" data-val="rule-red">赤字</button>
            <button type="button" data-ract="fmt" data-cmd="colorclass" data-val="rule-normal">黒字</button>
            <button type="button" data-ract="fmt" data-cmd="upsize">文字を大きく</button>
            <button type="button" data-ract="fmt" data-cmd="removeFormat">標準サイズに戻す</button>
            <span class="spacer"></span>
            <button type="button" class="ghost" data-ract="group-up" ${gi===0?'disabled':''}>▲段</button>
            <button type="button" class="ghost" data-ract="group-down" ${gi===slide.groups.length-1?'disabled':''}>▼段</button>
            <button type="button" class="ghost" data-ract="group-ins-above">⤒上に段を挿入</button>
            <button type="button" class="ghost" data-ract="group-ins-below">⤓下に段を挿入</button>
            <button type="button" class="ghost" data-ract="group-del" ${slide.groups.length<=1?'disabled':''}>🗑段</button>
          </div>
          <div class="rule-edit rule-group-edit" contenteditable="true">${g||''}</div>
        </div>`).join('')}
      <button type="button" class="small" data-ract="group-add">＋ 段を追加</button>
    </div>`).join('') + `<button type="button" class="small" data-ract="slide-add">＋ ページを追加</button>`;
}
function attachRuleSlidesEvents(){
  const container=document.getElementById('rule-editor');
  container.addEventListener('mousedown', e=>{ if(e.target.closest('.rich-toolbar')) e.preventDefault(); });
  container.addEventListener('click', e=>{
    const btn=e.target.closest('[data-ract]'); if(!btn || btn.disabled) return;
    const act=btn.dataset.ract;
    if(act==='slide-add'){ appData.ruleSlides.push({img:null, groups:['']}); renderRuleSlidesEditor(); return; }
    const slideCard=btn.closest('.rule-slide-card'); if(!slideCard) return;
    const si=Number(slideCard.dataset.si), slides=appData.ruleSlides, slide=slides[si];
    const groupBlock=btn.closest('.rule-group-block'), gi=groupBlock?Number(groupBlock.dataset.gi):null;
    if(act==='slide-up'){ [slides[si-1],slides[si]]=[slides[si],slides[si-1]]; renderRuleSlidesEditor(); }
    else if(act==='slide-down'){ [slides[si+1],slides[si]]=[slides[si],slides[si+1]]; renderRuleSlidesEditor(); }
    else if(act==='slide-del'){ if(confirm('このページを削除しますか？')){ slides.splice(si,1); renderRuleSlidesEditor(); } }
    else if(act==='slide-img-remove'){ slide.img=null; renderRuleSlidesEditor(); }
    else if(act==='group-add'){ slide.groups.push(''); renderRuleSlidesEditor(); }
    else if(act==='group-up'){ [slide.groups[gi-1],slide.groups[gi]]=[slide.groups[gi],slide.groups[gi-1]]; renderRuleSlidesEditor(); }
    else if(act==='group-down'){ [slide.groups[gi+1],slide.groups[gi]]=[slide.groups[gi],slide.groups[gi+1]]; renderRuleSlidesEditor(); }
    else if(act==='group-del'){ slide.groups.splice(gi,1); renderRuleSlidesEditor(); }
    else if(act==='group-ins-above'||act==='group-ins-below'){
      const at = act==='group-ins-above' ? gi : gi+1;
      slide.groups.splice(at,0,''); renderRuleSlidesEditor();
      const el=document.querySelectorAll(`#rule-editor .rule-slide-card[data-si="${si}"] .rule-group-edit`)[at];
      if(el) el.focus();
    }
    else if(act==='fmt'){
      const editEl=groupBlock.querySelector('.rule-group-edit');
      editEl.focus();
      const cmd=btn.dataset.cmd;
      if(cmd==='upsize') wrapSelectionBig();
      else if(cmd==='colorclass') wrapSelectionClass(btn.dataset.val);
      else document.execCommand(cmd, false, null);
      slide.groups[gi]=editEl.innerHTML;
    }
  });
  // 貼り付けは書式（文字色・サイズ）を外して文字だけにする
  container.addEventListener('paste', e=>{
    if(!e.target.closest('.rule-group-edit')) return;
    e.preventDefault();
    const text=(e.clipboardData||window.clipboardData).getData('text/plain');
    document.execCommand('insertText', false, text);
  });
  container.addEventListener('input', e=>{
    const editEl=e.target.closest('.rule-group-edit'); if(!editEl) return;
    appData.ruleSlides[Number(editEl.closest('.rule-slide-card').dataset.si)].groups[Number(editEl.closest('.rule-group-block').dataset.gi)]=editEl.innerHTML;
  });
  container.addEventListener('change', async e=>{
    if(e.target.dataset.ract!=='slide-img-input') return;
    const si=Number(e.target.closest('.rule-slide-card').dataset.si), f=e.target.files[0]; if(!f) return;
    appData.ruleSlides[si].img=await compressImageFile(f);
    renderRuleSlidesEditor();
  });
}
function wrapSelectionBig(){
  const sel=window.getSelection(); if(!sel.rangeCount) return;
  const range=sel.getRangeAt(0); if(range.collapsed) return;
  const span=document.createElement('span'); span.style.fontSize='1.5em';
  span.appendChild(range.extractContents()); range.insertNode(span);
  // 色クラス付きspanの中で拡大した場合、拡大した要素自身にも色クラスを持たせてハイライト枠を拡大後サイズで描画させる
  const parent=span.parentNode;
  if(parent && parent.classList && (parent.classList.contains('rule-red')||parent.classList.contains('rule-normal'))){
    span.classList.add(parent.classList.contains('rule-red')?'rule-red':'rule-normal');
    const others=Array.from(parent.childNodes).filter(n=>n!==span && !(n.nodeType===3 && n.textContent===''));
    if(!others.length && parent.parentNode){ parent.parentNode.insertBefore(span, parent); parent.parentNode.removeChild(parent); }
  }
}
function wrapSelectionClass(cls){
  const sel=window.getSelection(); if(!sel.rangeCount) return;
  const range=sel.getRangeAt(0); if(range.collapsed) return;
  const frag=range.extractContents();
  // 入れ子になった古い色クラスを剥がしてから付け直す
  const strip=node=>{ if(node.nodeType===1){ if(node.classList){ node.classList.remove('rule-red','rule-normal'); if(!node.classList.length) node.removeAttribute('class'); } Array.from(node.childNodes).forEach(strip); } };
  Array.from(frag.childNodes).forEach(strip);
  const span=document.createElement('span'); span.className=cls;
  span.appendChild(frag); range.insertNode(span);
  let node=span;
  while(node.parentNode && node.parentNode.classList && (node.parentNode.classList.contains('rule-red')||node.parentNode.classList.contains('rule-normal'))){
    const parent=node.parentNode;
    if(Array.from(parent.childNodes).some(n=>n!==node && !(n.nodeType===3 && n.textContent===''))) break;
    const gp=parent.parentNode; if(!gp) break;
    gp.insertBefore(node, parent); gp.removeChild(parent);
  }
}
